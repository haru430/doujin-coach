const cols=Math.min(3,Math.max(2,items.length+1));
return(<div style={{height:"100%",display:"flex",flexDirection:"column",gap:6}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}><span style={{fontSize:11,fontWeight:"700",color:"#7B8DB0"}}>{cat}</span><button onClick={()=>setShowAdd(!showAdd)} style={{padding:"2px 9px",borderRadius:6,border:"none",background:"linear-gradient(135deg,#7BA7F7,#A78BF7)",color:"#fff",fontWeight:"700",fontSize:10,cursor:"pointer"}}>＋</button></div>{showAdd&&(<div style={{background:"#F7F9FC",borderRadius:9,padding:"8px",border:"1px solid #E4E8F0",display:"flex",flexDirection:"column",gap:5,flexShrink:0}}><input placeholder="タイトル/メモ" value={addText} onChange={e=>setAddText(e.target.value)} style={{background:"#fff",border:"1.5px solid #E4E8F0",borderRadius:7,padding:"5px 8px",color:"#2A3550",fontSize:11,outline:"none",width:"100%"}}/><div style={{display:"flex",gap:5}}><select value={addSt} onChange={e=>setAddSt(e.target.value)} style={{flex:1,background:"#fff",border:"1.5px solid #E4E8F0",borderRadius:7,padding:"4px 6px",color:"#2A3550",fontSize:11}}>{SPO.map(s=><option key={s} value={s}>{s}</option>)}</select><button onClick={addItem} style={{padding:"4px 10px",borderRadius:7,border:"none",background:"linear-gradient(135deg,#7BA7F7,#A78BF7)",color:"#fff",fontWeight:"700",fontSize:10,cursor:"pointer"}}>追加</button><button onClick={()=>setShowAdd(false)} style={{padding:"4px 8px",borderRadius:7,border:"1px solid #E4E8F0",background:"transparent",color:"#8899B8",fontSize:10,cursor:"pointer"}}>×</button></div></div>)}<div style={{flex:1,overflowY:"auto",display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:6,alignContent:"start"}}>{items.map((item,idx)=>(<div key={idx} style={{background:SPB[item.status]||"#F0F4FA",border:`1.5px solid ${SPD[item.status]||"#D0D8EC"}`,borderRadius:10,padding:"8px 7px",display:"flex",flexDirection:"column",gap:4,minHeight:60,position:"relative"}}>{editIdx===idx?(<><input value={editText} onChange={e=>setEditText(e.target.value)} autoFocus style={{background:"#fff",border:"1px solid #C0CADC",borderRadius:5,padding:"3px 5px",fontSize:10,color:"#2A3550",outline:"none",width:"100%"}}/><div style={{display:"flex",gap:3}}><button onClick={()=>{updItem(idx,{text:editText});setEditIdx(null);}} style={{flex:1,padding:"3px",borderRadius:5,border:"none",background:"#7BA7F7",color:"#fff",fontSize:9,cursor:"pointer"}}>OK</button><button onClick={()=>setEditIdx(null)} style={{flex:1,padding:"3px",borderRadius:5,border:"1px solid #E0E4EC",background:"transparent",color:"#8899B8",fontSize:9,cursor:"pointer"}}>×</button></div></>):(<><div style={{fontSize:11,fontWeight:"600",color:"#2A3550",lineHeight:1.4,wordBreak:"break-all"}} onDoubleClick={()=>{setEditIdx(idx);setEditText(item.text);}}>{item.text||"無題"}</div><div style={{marginTop:"auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}><select value={item.status} onChange={e=>updItem(idx,{status:e.target.value})} onClick={e=>e.stopPropagation()} style={{background:"transparent",border:"none",color:SPT[item.status]||"#7B8DB0",fontSize:9,cursor:"pointer",fontWeight:"700",padding:0,outline:"none"}}>{SPO.map(s=><option key={s} value={s}>{s}</option>)}</select><button onClick={e=>{e.stopPropagation();remItem(idx);}} style={{background:"none",border:"none",color:"#C8D0E0",cursor:"pointer",fontSize:11,lineHeight:1,padding:0}}>×</button></div></>)}</div>))}{items.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",color:"#C0C8D8",fontSize:11,padding:"16px 0"}}>＋ を押して追加</div>}</div></div>);}

function App(){
const[data,setData]=useState(()=>{try{const r=localStorage.getItem(SK);return r?{...DD,...JSON.parse(r)}:DD;}catch{return DD;}});
const[lc,setLc]=useState("プロット/ネーム");const[rt,setRt]=useState("カレンダー");const[ep,setEp]=useState(false);const[pf,setPf]=useState(data.project);
const save=d=>{setData(d);try{localStorage.setItem(SK,JSON.stringify(d));}catch{}};
const dl=gdl(data.project.deadline),dc=uc(dl),dm=um(dl),ps=cps(data.tasks,data.project.totalPages);
const sp=()=>{save({...data,project:pf});setEp(false);};
const at=t=>save({...data,tasks:[...data.tasks,{id:data.nextTaskId,...t,status:"未着手",createdAt:new Date().toISOString()}],nextTaskId:data.nextTaskId+1});
const us=(id,status)=>save({...data,tasks:data.tasks.map(t=>t.id===id?{...t,status}:t)});
const dt=id=>save({...data,tasks:data.tasks.filter(t=>t.id!==id)});
const up=panels=>save({...data,panels});
const uc2=calendar=>save({...data,calendar});
const RT=["カレンダー","進捗管理","アドバイス"];
const card={background:"#fff",borderRadius:14,border:"1.5px solid #EDF0F7",boxShadow:"0 2px 12px rgba(100,120,200,0.06)"};
return(<div style={{height:"100%",background:"#F2F5FA",display:"flex",flexDirection:"column",overflow:"hidden"}}>
<div style={{background:"#fff",borderBottom:"1.5px solid #EDF0F7",padding:"0 12px",flexShrink:0,boxShadow:"0 1px 8px rgba(100,120,200,0.06)"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",height:50}}>
<div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:32,height:32,borderRadius:9,background:"linear-gradient(135deg,#FFF0E8,#F0E8FF)",border:"1.5px solid #EAD8FF",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>✏️</div><div><div style={{fontSize:13,fontWeight:"800",background:"linear-gradient(90deg,#F4A04A,#A04AF4)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>同人コーチ</div><div style={{fontSize:9,color:"#C0C8D8"}}>Doujin Production Manager</div></div></div>
<div style={{textAlign:"center",flex:1,padding:"0 8px"}}>{ep?(<div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",justifyContent:"center"}}><input value={pf.title} onChange={e=>setPf({...pf,title:e.target.value})} placeholder="タイトル" style={{background:"#F7F9FC",border:"1.5px solid #E4E8F0",borderRadius:8,padding:"4px 8px",color:"#2A3550",fontSize:12,outline:"none",width:90}}/><input value={pf.event} onChange={e=>setPf({...pf,event:e.target.value})} placeholder="イベント" style={{background:"#F7F9FC",border:"1.5px solid #E4E8F0",borderRadius:8,padding:"4px 8px",color:"#2A3550",fontSize:12,outline:"none",width:80}}/><input type="date" value={pf.deadline} onChange={e=>setPf({...pf,deadline:e.target.value})} style={{background:"#F7F9FC",border:"1.5px solid #E4E8F0",borderRadius:8,padding:"4px 6px",color:"#2A3550",fontSize:11,outline:"none"}}/><input type="number" value={pf.totalPages} onChange={e=>setPf({...pf,totalPages:e.target.value})} placeholder="総P" style={{background:"#F7F9FC",border:"1.5px solid #E4E8F0",borderRadius:8,padding:"4px 6px",color:"#2A3550",fontSize:12,outline:"none",width:50}}/><button onClick={sp} style={{padding:"5px 10px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#7BA7F7,#A78BF7)",color:"#fff",fontWeight:"700",fontSize:12,cursor:"pointer"}}>保存</button><button onClick={()=>setEp(false)} style={{padding:"5px 8px",borderRadius:8,border:"1.5px solid #E4E8F0",background:"transparent",color:"#8899B8",fontSize:12,cursor:"pointer"}}>×</button></div>):(<div style={{cursor:"pointer"}} onClick={()=>{setPf(data.project);setEp(true);}}><div style={{fontSize:13,fontWeight:"800",color:"#2A3550"}}>{data.project.title||"プロジェクト名"}</div><div style={{fontSize:9,color:"#A0AABF"}}>{data.project.event||"イベント未設定"} — タップして編集</div></div>)}</div>
<div style={{display:"flex",alignItems:"center",gap:6}}><div style={{textAlign:"right"}}><div style={{fontSize:9,color:"#A0AABF"}}>現在の進捗</div><div style={{fontSize:13,fontWeight:"900",color:"#5A7EF4",fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>{ps["全体"].done}<span style={{fontSize:9,color:"#9AAEDD"}}>p</span><span style={{fontSize:11,color:"#C8D4EE",margin:"0 2px"}}>/</span>{ps["全体"].total||"—"}<span style={{fontSize:9,color:"#9AAEDD"}}>p</span></div></div><div style={{background:dl!==null&&dl<7?"#FFF2F2":"#F2F8FF",border:`1.5px solid ${dc}30`,borderRadius:10,padding:"4px 8px",textAlign:"center",minWidth:52}}>{data.project.deadline?(<><div style={{fontSize:10,fontWeight:"800",color:dc,whiteSpace:"nowrap"}}>{dl!==null&&dl>=0?`残り${dl}日`:dl===null?"未設定":"期限切れ"}</div><div style={{fontSize:8,color:"#A0AABF"}}>{data.project.deadline}</div></>):(<div style={{fontSize:9,color:"#B0BACC",cursor:"pointer"}} onClick={()=>{setPf(data.project);setEp(true);}}>〆切<br/>未設定</div>)}</div></div>
</div></div>
<div style={{background:`linear-gradient(135deg,${dc}15,${dc}06)`,borderBottom:`1px solid ${dc}25`,padding:"4px 12px",flexShrink:0}}><span style={{fontSize:11,fontWeight:"700",color:dc}}>{dm}</span></div>
<div style={{flex:1,display:"flex",gap:8,padding:"8px 10px",minHeight:0,overflow:"hidden"}}>
<div style={{...card,display:"flex",flexDirection:"column",width:"42%",minWidth:0,overflow:"hidden"}}>
<div style={{display:"flex",borderBottom:"1.5px solid #EDF0F7",padding:"0 6px",flexShrink:0}}>{LC.map(cat=>(<button key={cat} onClick={()=>setLc(cat)} style={{padding:"7px 7px",border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",fontSize:10,background:lc===cat?"#F2F5FA":"transparent",color:lc===cat?"#7B5CF4":"#A0AABF",fontWeight:lc===cat?"700":"400",borderBottom:lc===cat?"2px solid #A04AF4":"2px solid transparent",whiteSpace:"nowrap"}}>{cat}</button>))}</div>
<div style={{flex:1,padding:"8px",overflow:"hidden",display:"flex",flexDirection:"column"}}><PanelGrid cat={lc} panels={data.panels} onUpdate={up}/></div>
</div>
<div style={{...card,display:"flex",flexDirection:"column",flex:1,minWidth:0,overflow:"hidden"}}>
<div style={{padding:"8px 12px 0",flexShrink:0}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div style={{fontSize:10,color:"#A0AABF"}}>〆切: <span style={{fontWeight:"700",color:dc}}>{data.project.deadline||"未設定"}</span></div><div style={{display:"flex",gap:3}}>{PS.map(s=>{const st=SS[s],pg=ps[s];return(<div key={s} style={{background:st.soft,borderRadius:7,padding:"2px 6px",border:`1px solid ${st.ac}30`,textAlign:"center"}}><div style={{fontSize:8,fontWeight:"700",color:st.ac}}>{s}</div><div style={{fontSize:10,fontWeight:"800",color:st.ac,fontVariantNumeric:"tabular-nums"}}>{pg.done}<span style={{fontSize:7}}>p</span>/{pg.total||"—"}<span style={{fontSize:7}}>p</span></div></div>);})}</div></div>
<div style={{display:"flex",gap:3}}>{RT.map(t=>(<button key={t} onClick={()=>setRt(t)} style={{padding:"5px 11px",border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",fontSize:11,background:rt===t?"#F2F5FA":"transparent",color:rt===t?"#7B5CF4":"#A0AABF",fontWeight:rt===t?"700":"400",borderBottom:rt===t?"2px solid #A04AF4":"2px solid transparent"}}>{t}</button>))}</div>
</div>
<div style={{borderTop:"1.5px solid #EDF0F7",flex:1,padding:"10px 12px",overflow:"hidden",display:"flex",flexDirection:"column"}}>
{rt==="カレンダー"&&<MiniCalendar calendar={data.calendar} onUpdate={uc2} deadline={data.project.deadline}/>}
{rt==="進捗管理"&&<ProgressPane tasks={data.tasks} totalPages={data.project.totalPages} onAddTask={at} onUpdateStatus={us} onDeleteTask={dt}/>}
{rt==="アドバイス"&&<Advisor project={data.project} tasks={data.tasks}/>}
</div>
</div>
</div>
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
