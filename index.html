const swCode=`const CACHE="doujin-v1";self.addEventListener("install",e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll([])).then(()=>self.skipWaiting()));});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});self.addEventListener("fetch",e=>{if(e.request.url.includes("anthropic.com"))return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
if("serviceWorker"in navigator){const b=new Blob([swCode],{type:"text/javascript"});navigator.serviceWorker.register(URL.createObjectURL(b),{scope:"./"}).catch(()=>{});}
const m={name:"同人コーチ",short_name:"同人コーチ",display:"standalone",background_color:"#F2F5FA",theme_color:"#A04AF4",start_url:"./",icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%23A04AF4'/><text y='140' x='96' text-anchor='middle' font-size='120'>✏️</text></svg>",sizes:"192x192",type:"image/svg+xml"}]};
const mb=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
const ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(mb);document.head.appendChild(ml);
const fixH=()=>{document.body.style.height=window.innerHeight+"px";const r=document.getElementById("root");if(r)r.style.height=window.innerHeight+"px";};fixH();window.addEventListener("resize",fixH);
</script>

function gdl(dl){if(!dl)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(dl);d.setHours(0,0,0,0);return Math.ceil((d-t)/86400000);}

function cps(tasks,tp){const r={};for(const s of PS){const st=tasks.filter(t=>t.stage===s);r[s]={done:st.filter(t=>t.status==="完了").reduce((a,t)=>a+(Number(t.pages)||0),0),total:st.reduce((a,t)=>a+(Number(t.pages)||0),0)};}r["全体"]={done:r["仕上げ"].done,total:Number(tp)||0};return r;}
