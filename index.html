function ProgressPane({data,save}){
const{tasks,goals,dailyLog,project}=data;const ps=cps(tasks,project.totalPages);
const[showTaskForm,setShowTaskForm]=useState(false);const[nt,setNt]=useState({title:"",stage:"ネーム",pages:""});
const[showGoal,setShowGoal]=useState(false);const[goalForm,setGoalForm]=useState(goals||{dailyPages:0,targetStage:"仕上げ"});
const[todayPages,setTodayPages]=useState("");const[todayStage,setTodayStage]=useState("仕上げ");const[todayNote,setTodayNote]=useState("");
const today=todayYmd();const todayTotal=(dailyLog||[]).filter(l=>l.date===today).reduce((a,l)=>a+(Number(l.pages)||0),0);
const dailyGoal=Number(goals?.dailyPages)||0;const goalPct=dailyGoal>0?Math.min(100,Math.round(todayTotal/dailyGoal*100)):0;
const addTask=t=>save({...data,tasks:[...tasks,{id:data.nextTaskId,...t,status:"未着手",createdAt:new Date().toISOString()}],nextTaskId:data.nextTaskId+1});
const updateStatus=(id,status)=>save({...data,tasks:tasks.map(t=>t.id===id?{...t,status}:t)});
const deleteTask=id=>save({...data,tasks:tasks.filter(t=>t.id!==id)});
const saveGoal=()=>{save({...data,goals:goalForm});setShowGoal(false);};
const submitToday=()=>{
const pages=Number(todayPages);if(!pages)return;
const newLog=[...(dailyLog||[]),{date:today,pages,stage:todayStage,note:todayNote}];
let newTasks=[...tasks];let remaining=pages;
for(let i=0;i<newTasks.length&&remaining>0;i++){const t=newTasks[i];if(t.stage===todayStage&&t.status!=="完了"){const needed=(t.pages||0)-(t.donePages||0);if(remaining>=needed){remaining-=needed;newTasks[i]={...t,donePages:t.pages||0,status:"完了"};}else{newTasks[i]={...t,donePages:(t.donePages||0)+remaining,status:"作業中"};remaining=0;}}}
const stageRemaining=newTasks.filter(t=>t.stage===todayStage&&t.status!=="完了");
let nextTaskId=data.nextTaskId;
if(stageRemaining.length===0&&todayStage!=="仕上げ"){const ni=PS.indexOf(todayStage)+1;if(ni<PS.length){const ns=PS[ni];newTasks=[...newTasks,{id:nextTaskId,title:`${ns}作業（自動生成）`,stage:ns,pages:project.totalPages||0,status:"未着手",createdAt:new Date().toISOString(),auto:true}];nextTaskId++;}}

<input type="number" value={pf.totalPages} onChange={e=>setPf({...pf,totalPages:e.target.value})} placeholder="総P" style={{background:"#F7F9FC",border:"1.5px solid #E4E8F0",borderRadius:8,padding:"4px 6px",color:"#2A3550",fontSize:12,outline:"none",width:50}}/>
<button onClick={sp} style={{padding:"5px 10px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#7BA7F7,#A78BF7)",color:"#fff",fontWeight:"700",fontSize:12,cursor:"pointer"}}>保存</button>
<button onClick={()=>setEp(false)} style={{padding:"5px 8px",borderRadius:8,border:"1.5px solid #E4E8F0",background:"transparent",color:"#8899B8",fontSize:12,cursor:"pointer"}}>×</button>
</div>):(<div style={{cursor:"pointer"}} onClick={()=>{setPf(data.project);setEp(true);}}>
<div style={{fontSize:13,fontWeight:"800",color:"#2A3550"}}>{data.project.title||"プロジェクト名"}</div>
<div style={{fontSize:9,color:"#A0AABF"}}>{data.project.event||"イベント未設定"} — タップして編集</div>
</div>)}
</div>
<div style={{display:"flex",alignItems:"center",gap:6}}>
<div style={{textAlign:"right"}}><div style={{fontSize:9,color:"#A0AABF"}}>現在の進捗</div><div style={{fontSize:13,fontWeight:"900",color:"#5A7EF4",fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap"}}>{ps["全体"].done}<span style={{fontSize:9,color:"#9AAEDD"}}>p</span><span style={{fontSize:11,color:"#C8D4EE",margin:"0 2px"}}>/</span>{ps["全体"].total||"—"}<span style={{fontSize:9,color:"#9AAEDD"}}>p</span></div></div>
<div style={{background:dl!==null&&dl<7?"#FFF2F2":"#F2F8FF",border:`1.5px solid ${dc}30`,borderRadius:10,padding:"4px 8px",textAlign:"center",minWidth:52}}>
{data.project.deadline?(<><div style={{fontSize:10,fontWeight:"800",color:dc,whiteSpace:"nowrap"}}>{dl!==null&&dl>=0?`残り${dl}日`:dl===null?"未設定":"期限切れ"}</div><div style={{fontSize:8,color:"#A0AABF"}}>{data.project.deadline}</div></>):(<div style={{fontSize:9,color:"#B0BACC",cursor:"pointer"}} onClick={()=>{setPf(data.project);setEp(true);}}>〆切<br/>未設定</div>)}
</div></div></div></div>
<div style={{background:`linear-gradient(135deg,${dc}15,${dc}06)`,borderBottom:`1px solid ${dc}25`,padding:"4px 12px",flexShrink:0}}><span style={{fontSize:11,fontWeight:"700",color:dc}}>{dm}</span></div>
<div style={{flex:1,display:"flex",gap:8,padding:"8px 10px",minHeight:0,overflow:"hidden"}}>
<div style={{...card,display:"flex",flexDirection:"column",width:"42%",minWidth:0,overflow:"hidden"}}>
<div style={{display:"flex",borderBottom:"1.5px solid #EDF0F7",padding:"0 6px",flexShrink:0}}>
{LC.map(cat=>(<button key={cat} onClick={()=>setLc(cat)} style={{padding:"7px 7px",border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",fontSize:10,background:lc===cat?"#F2F5FA":"transparent",color:lc===cat?"#7B5CF4":"#A0AABF",fontWeight:lc===cat?"700":"400",borderBottom:lc===cat?"2px solid #A04AF4":"2px solid transparent",whiteSpace:"nowrap"}}>{cat}</button>))}
</div>
<div style={{flex:1,padding:"8px",overflow:"hidden",display:"flex",flexDirection:"column"}}>
{lc==="プロット/ネーム"&&<PlotGrid panels={data.panels} onUpdate={up}/>}
{lc==="原稿"&&<MansionGrid panels={data.panels} onUpdate={up}/>}
{lc==="グッズ/ノベルティ"&&<GoodsGrid panels={data.panels} onUpdate={up}/>}
</div></div>
<div style={{...card,display:"flex",flexDirection:"column",flex:1,minWidth:0,overflow:"hidden"}}>
<div style={{padding:"8px 12px 0",flexShrink:0}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
<div style={{fontSize:10,color:"#A0AABF"}}>〆切: <span style={{fontWeight:"700",color:dc}}>{data.project.deadline||"未設定"}</span></div>
<div style={{display:"flex",gap:3}}>{PS.map(s=>{const st=SS[s],pg=ps[s];return(<div key={s} style={{background:st.soft,borderRadius:7,padding:"2px 6px",border:`1px solid ${st.ac}30`,textAlign:"center"}}><div style={{fontSize:8,fontWeight:"700",color:st.ac}}>{s}</div><div style={{fontSize:10,fontWeight:"800",color:st.ac,fontVariantNumeric:"tabular-nums"}}>{pg.done}<span style={{fontSize:7}}>p</span>/{pg.total||"—"}<span style={{fontSize:7}}>p</span></div></div>);})}</div>
</div>
<div style={{display:"flex",gap:3}}>{RT.map(t=>(<button key={t} onClick={()=>setRt(t)} style={{padding:"5px 11px",border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",fontSize:11,background:rt===t?"#F2F5FA":"transparent",color:rt===t?"#7B5CF4":"#A0AABF",fontWeight:rt===t?"700":"400",borderBottom:rt===t?"2px solid #A04AF4":"2px solid transparent"}}>{t}</button>))}</div>
</div>
<div style={{borderTop:"1.5px solid #EDF0F7",flex:1,padding:"10px 12px",overflow:"hidden",display:"flex",flexDirection:"column"}}>
{rt==="カレンダー"&&<MiniCalendar calendar={data.calendar} onUpdate={uc2} deadline={data.project.deadline}/>}
{rt==="進捗管理"&&<ProgressPane data={data} save={save}/>}
{rt==="アドバイス"&&<Advisor project={data.project} tasks={data.tasks} goals={data.goals}/>}
</div></div></div></div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
